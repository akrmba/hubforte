# docker-compose.yml — LOCAL DEVELOPMENT ONLY
# Uses .env file at project root (copied from artifacts/api-server/.env.example)
# Database (Neon Postgres) is external — not containerised.

services:
  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - artifacts/api-server/.env
    environment:
      NODE_ENV: development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  crm:
    build:
      context: .
      dockerfile: artifacts/crm/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_LMS_URL: http://localhost:5174
    ports:
      - "5173:80"
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped

  lms:
    build:
      context: .
      dockerfile: artifacts/lms/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5174:80"
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - artifacts/api-server/.env
    environment:
      APP_URL: http://api-server:3000
      POLL_INTERVAL_SECONDS: "60"
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
